# -----------------------------------------------------
#! Audio & Brightness
# -----------------------------------------------------
bindl = Alt ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_SOURCE@ toggle # [hidden] Toggle Mic Mute (Alt)
bindl = Super ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_SOURCE@ toggle # [hidden] Toggle Mic Mute (Super)
bindl = ,XF86AudioMute, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 0% # [hidden] Mute Speakers (Mute Key)
bindl = Super+Shift,M, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 0% # [hidden] Mute Speakers (Super+Shift+M)
bindle=, XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+ # [hidden] Volume Up
bindle=, XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- # [hidden] Volume Down

# -----------------------------------------------------
#! Basic Actions & Tools
# -----------------------------------------------------
bind = Super, Return, exec, ghostty # Launch Terminal (ghostty)
bind = Super, P, exec, nautilus --new-window # Launch File Manager (Nautilus)
bind = Super, SPACE, exec, pkill wofi || wofi --show drun # Launch App Launcher (wofi)

# Clipboard, Emoji, Logout, Screenshots
bind = Super, V, exec,pkill wofi || cliphist list | wofi -S dmenu | cliphist decode | wl-copy # Clipboard History
bind = Super, Period, exec, pkill fuzzel || ~/.local/bin/fuzzel-emoji # Emoji Picker
bind = Ctrl+Shift+Alt, Delete, exec, pkill wlogout || wlogout -p layer-shell # Logout Menu
bind = , Print, exec, bash -c "mkdir -p ~/Pictures/Screenshots && ~/.config/hypr/scripts/grimblast.sh --freeze copysave area ~/Pictures/Screenshots/Screenshot_$(date '+%Y-%m-%d_%H.%M.%S').png" # Screenshot Area (Freeze) -> Clipboard
bind = SHIFT, Print, exec, bash -c "mkdir -p ~/Pictures/Screenshots && ~/.config/hypr/scripts/grimblast.sh copysave output ~/Pictures/Screenshots/Screenshot_$(date '+%Y-%m-%d_%H.%M.%S').png" # Screenshot Fullscreen -> Clipboard & File
# -----------------------------------------------------
#! Session
# -----------------------------------------------------
bind = Super, L, exec, loginctl lock-session # Lock Screen
bindl = Super+Shift, L, exec, sleep 0.1 && systemctl suspend || loginctl suspend # Suspend System
bind = Ctrl+Shift+Alt+Super, Delete, exec, systemctl poweroff || loginctl poweroff # [hidden] Power Off System

# -----------------------------------------------------
#! Window Management
# -----------------------------------------------------
# Focus
bind = Super, Left, movefocus, l # Focus Left
bind = Super, Right, movefocus, r # Focus Right
bind = Super, Up, movefocus, u # Focus Up
bind = Super, Down, movefocus, d # Focus Down
bind = Super, BracketLeft, movefocus, l # [hidden] Focus Left
bind = Super, BracketRight, movefocus, r # [hidden] Focus Right

# Move/Resize with Mouse
bindm = Super, mouse:272, movewindow # Move Window (Mouse Drag)
bindm = Super, mouse:273, resizewindow # Resize Window (Mouse Drag)

# Close Windows
bind = Super, Q, killactive, # Close Active Window
bind = Super+Shift+Alt, Q, exec, hyprctl kill # Kill Selected Window

# Arrange Windows
bind = Super+Shift, Left, movewindow, l # Move Window Left
bind = Super+Shift, Right, movewindow, r # Move Window Right
bind = Super+Shift, Up, movewindow, u # Move Window Up
bind = Super+Shift, Down, movewindow, d # Move Window Down

# Split Ratio
binde = Super, Minus, splitratio, -0.1 # Decrease Split Ratio
binde = Super, Equal, splitratio, +0.1 # Increase Split Ratio
binde = Super, Semicolon, splitratio, -0.1 # [hidden] Decrease Split Ratio
binde = Super, Apostrophe, splitratio, +0.1 # [hidden] Increase Split Ratio

# Window Mode
bind = Super, T, togglefloating, # Toggle Floating Mode (Active Window)
bind = Super+Alt, Space, togglefloating, # Toggle Floating Mode (Global?)
bind = Super, F, fullscreen, 0 # Toggle Fullscreen (Real)
bind = Super, D, fullscreen, 1 # [hidden] Toggle Fullscreen (Keep Bar?)
bind = Super, Semicolon, pseudo, # Toggle Pseudo-Tiling Mode

# Switch to Adjacent Workspace
bind = Super, mouse_up, workspace, +1 # Next Workspace (Scroll Up)
bind = Super, mouse_down, workspace, -1 # Previous Workspace (Scroll Down)
bind = Ctrl+Super, Right, workspace, r+1 # Next Workspace (Relative)
bind = Ctrl+Super, Left, workspace, r-1 # Previous Workspace (Relative)
bind = Ctrl+Super+Alt, Right, workspace, m+1 # Next Occupied Workspace
bind = Ctrl+Super+Alt, Left, workspace, m-1 # Previous Occupied Workspace
bind = Super, Page_Down, workspace, +1 # Next Workspace
bind = Super, Page_Up, workspace, -1 # Previous Workspace
bind = Ctrl+Super, Page_Down, workspace, r+1 # [hidden] Next Workspace (Relative)
bind = Ctrl+Super, Page_Up, workspace, r-1 # [hidden] Previous Workspace (Relative)

# Special Workspace (Scratchpad)
bind = Super, S, togglespecialworkspace, # Toggle Special Workspace
bind = Super, mouse:275, togglespecialworkspace, # [hidden] Toggle Special Workspace (Mouse 4)

# -----------------------------------------------------
#! Workspace Management
# -----------------------------------------------------
# Move Window to Workspace (Silently)
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

# Move Window to Special Workspace (Silently)
bind = Ctrl+Super+Shift, Up, movetoworkspacesilent, special # [hidden] Move Win to Special Ws (Silent)
bind = Super+Alt, S, movetoworkspacesilent, special # Move Win to Special Ws (Silent)

# Move Window to Adjacent Workspace
bind = Ctrl+Super+Shift, Right, movetoworkspace, r+1 # Move Win to Next Ws
bind = Ctrl+Super+Shift, Left, movetoworkspace, r-1 # Move Win to Prev Ws
bind = Super+Shift, mouse_down, movetoworkspace, r-1 # Move Win to Prev Ws (Scroll Down)
bind = Super+Shift, mouse_up, movetoworkspace, r+1 # Move Win to Next Ws (Scroll Up)
bind = Super+Alt, mouse_down, movetoworkspace, -1 # [hidden] Move Win to Prev Ws (Scroll Down, Alt)
bind = Super+Alt, mouse_up, movetoworkspace, +1 # [hidden] Move Win to Next Ws (Scroll Up, Alt)
bind = Super+Alt, Page_Down, movetoworkspace, +1 # Move Win to Next Ws
bind = Super+Alt, Page_Up, movetoworkspace, -1 # Move Win to Prev Ws
bind = Super+Shift, Page_Down, movetoworkspace, r+1 # Move Win to Next Ws (Relative)
bind = Super+Shift, Page_Up, movetoworkspace, r-1 # Move Win to Prev Ws (Relative)

# Other
bind = Super, P, pin # Pin/Unpin Window (Sticky) - Note: P is also Nautilus
bind = Alt, Tab, cyclenext # Cycle Windows (Like Alt+Tab)
bind = Alt, Tab, bringactivetotop, # [hidden] Bring Active to Top

# -----------------------------------------------------
#! Media (playerctl)
# -----------------------------------------------------
bindl= Super+Shift, N, exec, playerctl next || playerctl position `bc <<< "100 * $(playerctl metadata mpris:length) / 1000000 / 100"` # Media Next
bindl= ,XF86AudioNext, exec, playerctl next || playerctl position `bc <<< "100 * $(playerctl metadata mpris:length) / 1000000 / 100"` # [hidden] Media Next
bindl= Super+Shift, B, exec, playerctl previous # Media Previous
bindl= ,XF86AudioPrev, exec, playerctl previous # [hidden] Media Previous
bindl= Super+Shift, P, exec, playerctl play-pause # Media Play/Pause
bindl= ,XF86AudioPlay, exec, playerctl play-pause # [hidden] Media Play/Pause
bindl= ,XF86AudioPause, exec, playerctl play-pause # [hidden] Media Play/Pause
