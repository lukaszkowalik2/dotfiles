########################################################################################
# STARTUP APPS (exec-once)
########################################################################################

exec-once = ghostty # Terminal
# exec-once = ags run & # Widgets
exec-once = waybar & # Status bar
exec-once = swaync & # Notifications

# exec-once = gnome-keyring-daemon --start --components=secrets # GNOME Keyring 
# exec-once = /usr/bin/kwalletd5 & # KWallet Daemon 
# exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 || /usr/libexec/polkit-gnome-authentication-agent-1 # GNOME Polkit Agent 
exec-once = /usr/lib/polkit-kde-authentication-agent-1 & # KDE Polkit Agent

exec-once = hypridle # Idle manager
exec-once = hyprpaper # Wallpaper
exec-once = dbus-update-activation-environment --all # D-Bus env update
exec-once = hyprpm reload # Plugin manager reload
exec-once = wl-paste --type text --watch cliphist store # Clipboard history (text)
exec-once = wl-paste --type image --watch cliphist store # Clipboard history (image)
exec-once = hyprctl setcursor rose-pine-hyprcursor 24 # Set cursor
